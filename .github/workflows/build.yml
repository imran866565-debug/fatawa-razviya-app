name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          T=$(unzip -l "$APK" | grep -c 'assets/content/tashreeh/jild-')
          C=$(unzip -l "$APK" | grep -c 'assets/content/jild-')
          F=$(unzip -l "$APK" | grep -c 'assets/content/fehrist-')
          echo "tashreeh files in APK: $T (expect 30)"
          echo "content jild files in APK: $C (expect 30)"
          echo "fehrist files in APK: $F (expect 30)"
          test "$T" -eq 30
          test "$C" -eq 30
          test "$F" -eq 30
          # NOTE: binary AndroidManifest.xml stores strings as UTF-16LE, so plain
          # `strings` finds nothing — use `strings -e l`.
          unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'com.fatawa.razviya.easyurdu'
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging "$APK" | grep -E "package: name='com.fatawa.razviya.easyurdu' versionCode='4' versionName='1.1.1'"
          # v1.1.1 fix proof: WebViewAssetLoader must be linked (the file://
          # fetch block is what broke v1.1.0 on the phone), and the bundled
          # reader must carry the English toggle + original search options.
          unzip -p "$APK" classes.dex | strings | grep -q 'androidx/webkit/WebViewAssetLoader'
          unzip -p "$APK" assets/app/app.js | grep -q 'applyLanguage'
          unzip -p "$APK" assets/app/index.html | grep -q 'search-mode'
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatawa-razviya-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Fatawa Razviya — Aasan Urdu v1.1.1 (Load fix + English + original search)
          body: |
            Fatawa Razviya — Aasan Urdu (v1.1.1, debug build).

            Fixes the v1.1.0 bug reported from the phone: volumes and rasail
            showed "content could not be loaded". fetch() from a file:// page
            is blocked in current Android WebView, so the bundled reader is
            now served by WebViewAssetLoader over a real https origin —
            same files, same offline data, no network needed.

            - English language added (Settings → Language; book text stays Urdu)
            - Search rebuilt with the original app's options: different-words
              vs complete-sentence mode, Volumes/Booklets scope, all-volumes
              vs selected-volumes range, and the تلاش کریں button
            - All 30 jilds complete: 7,923 masail/sections, 19,698 pages
            - Rasail, fehrist, search, bookmarks and notes
            - Fully offline — no account, no internet needed
          files: app/build/outputs/apk/debug/app-debug.apk
