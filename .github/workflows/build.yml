name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          T=$(unzip -l "$APK" | grep -c 'assets/content/tashreeh/jild-')
          C=$(unzip -l "$APK" | grep -c 'assets/content/jild-')
          F=$(unzip -l "$APK" | grep -c 'assets/content/fehrist-')
          echo "tashreeh files in APK: $T (expect 30)"
          echo "content jild files in APK: $C (expect 30)"
          echo "fehrist files in APK: $F (expect 30)"
          test "$T" -eq 30
          test "$C" -eq 30
          test "$F" -eq 30
          # NOTE: binary AndroidManifest.xml stores strings as UTF-16LE, so plain
          # `strings` finds nothing — use `strings -e l`.
          unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'com.fatawa.razviya.easyurdu'
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging "$APK" | grep -E "package: name='com.fatawa.razviya.easyurdu' versionCode='5' versionName='1.1.2'"
          # v1.1.1 fix proof: WebViewAssetLoader must be linked (the file://
          # fetch block is what broke v1.1.0 on the phone), and the bundled
          # reader must carry the English toggle + original search options.
          unzip -p "$APK" classes.dex | strings | grep -q 'androidx/webkit/WebViewAssetLoader'
          unzip -p "$APK" assets/app/app.js | grep -q 'applyLanguage'
          unzip -p "$APK" assets/app/index.html | grep -q 'search-mode'
          # v1.1.2 fix proof: the app shell is exactly viewport height so the
          # bottom nav stays on screen and the lists scroll inside their own
          # containers (v1.1.1 grew to document height and buried the nav),
          # and the reader merges same-class spans + throttles its scroll
          # handler (the lag fix).
          unzip -p "$APK" assets/app/styles.css | grep -q 'height:100dvh'
          unzip -p "$APK" assets/app/app.js | grep -q 'runEnded'
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatawa-razviya-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release v1.1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: Fatawa Razviya — Aasan Urdu v1.1.2 (Bottom nav + scroll + lag fix)
          body: |
            Fatawa Razviya — Aasan Urdu (v1.1.2, debug build).

            Fixes the v1.1.1 bugs reported from the phone:
            - Bottom navigation bar was missing — the app shell grew to the
              full document height, pushing the nav (Volumes / Booklets /
              Search / Saved / Settings) below the screen. The shell is now
              exactly viewport height, so the nav stays pinned at the bottom
              and Favourites/Notes are reachable again.
            - Lists and the reader did not scroll properly — scrolling now
              happens inside each screen's own container, not the document.
            - Reader scroll lag — the book text is no longer justified
              (justified Nastaliq is very slow to lay out), adjacent
              same-style text spans are merged, and the scroll handler is
              throttled. Scrolling should now feel smooth like the original.

            - Load fix from v1.1.1 kept (WebViewAssetLoader, https origin)
            - English language (Settings → Language; book text stays Urdu)
            - Search with the original app's options
            - All 30 jilds complete: 7,923 masail/sections, 19,698 pages
            - Rasail, fehrist, search, bookmarks and notes
            - Fully offline — no account, no internet needed
          files: app/build/outputs/apk/debug/app-debug.apk
