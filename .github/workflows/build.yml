name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          T=$(unzip -l "$APK" | grep -c 'assets/content/tashreeh/jild-')
          C=$(unzip -l "$APK" | grep -c 'assets/content/jild-')
          F=$(unzip -l "$APK" | grep -c 'assets/content/fehrist-')
          TP=$(unzip -l "$APK" | grep -c 'assets/content/tashreeh-pages/jild-')
          R=$(unzip -l "$APK" | grep -c 'assets/content/refs-')
          echo "tashreeh files in APK: $T (expect 30)"
          echo "content jild files in APK: $C (expect 30)"
          echo "fehrist files in APK: $F (expect 30)"
          echo "per-page tashreeh files in APK: $TP (expect 30)"
          echo "reference files in APK: $R (expect 30)"
          test "$T" -eq 30
          test "$C" -eq 30
          test "$F" -eq 30
          test "$TP" -eq 30
          test "$R" -eq 30
          # NOTE: binary AndroidManifest.xml stores strings as UTF-16LE, so plain
          # `strings` finds nothing — use `strings -e l`.
          unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'com.fatawa.razviya.easyurdu'
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging "$APK" | grep -E "package: name='com.fatawa.razviya.easyurdu' versionCode='7' versionName='1.1.4'"
          # v1.1.1 fix proof: WebViewAssetLoader must be linked (the file://
          # fetch block is what broke v1.1.0 on the phone), and the bundled
          # reader must carry the original search options.
          unzip -p "$APK" classes.dex | strings | grep -q 'androidx/webkit/WebViewAssetLoader'
          unzip -p "$APK" assets/app/index.html | grep -q 'search-mode'
          # v1.1.2 fix proof: the app shell is exactly viewport height so the
          # bottom nav stays on screen and the lists scroll inside their own
          # containers (v1.1.1 grew to document height and buried the nav),
          # and the reader merges same-class spans + throttles its scroll
          # handler (the lag fix).
          unzip -p "$APK" assets/app/app.js | grep -q 'runEnded'
          # v1.1.3 fix proof: the search-shake fix REMOVED height:100dvh
          # (the keyboard resize that made the search screen jump on
          # Android WebView), and the reader has an exit/home button,
          # per-page tashreeh, the orange reference box, and the bilingual
          # UI with the original app's navy-pill lesson list. The English
          # language toggle is gone (one bilingual UI only).
          if unzip -p "$APK" assets/app/styles.css | grep -q 'height:100dvh'; then
            echo "FAIL: styles.css still contains height:100dvh"; exit 1
          fi
          if unzip -p "$APK" assets/app/app.js | grep -q 'applyLanguage'; then
            echo "FAIL: app.js still contains the removed English toggle"; exit 1
          fi
          unzip -p "$APK" assets/app/index.html | grep -q 'interactive-widget=resizes-visual'
          unzip -p "$APK" assets/app/index.html | grep -q 'reader-home'
          unzip -p "$APK" assets/app/app.js | grep -q 'loadTashreehPages'
          unzip -p "$APK" assets/app/app.js | grep -q 'renderRef'
          unzip -p "$APK" assets/app/app.js | grep -q 'lesson-pill'
          unzip -p "$APK" assets/app/styles.css | grep -q 'refbox'
          unzip -p "$APK" assets/app/styles.css | grep -q 'arabic-blue'
          # v1.1.4 proof: the bundled tashreeh must be the FULL v4 re-write,
          # not the v3 text. v4 is decisively longer (30.08M chars vs v3
          # 24.16M) and carries ~103k definitional "کا مطلب" glosses (v3: 353).
          # Totals must still be exactly 7,923 items / 19,698 pages, and
          # masala-72's sawal must not honour Gangohi with 'فرمایا'.
          mkdir -p /tmp/apk-tashreeh
          cd /tmp/apk-tashreeh
          unzip -o -q "$GITHUB_WORKSPACE/$APK" 'assets/content/tashreeh/jild-*.json' 'assets/content/tashreeh-pages/jild-*.json'
          python3 - <<'PYEOF'
          import json, glob
          items = pages = chars = kamatlab = 0
          for f in sorted(glob.glob('assets/content/tashreeh/jild-*.json')):
              d = json.load(open(f, encoding='utf-8'))
              for m in d['masail']:
                  items += 1
                  pages += len(set(m['pages']))
                  t = (m.get('tashreeh_sawal') or '') + (m.get('tashreeh_jawab') or '')
                  chars += len(t)
                  kamatlab += t.count('کا مطلب')
          print(f'APK tashreeh: items={items} pages={pages} chars={chars} ka-matlab={kamatlab}')
          assert items == 7923, items
          assert pages == 19698, pages
          assert chars > 28000000, chars
          assert kamatlab > 50000, kamatlab
          m72 = [m for m in json.load(open('assets/content/tashreeh/jild-15.json', encoding='utf-8'))['masail'] if m['id'] == 'jild15-masala-72'][0]
          assert 'فرمایا' not in (m72.get('tashreeh_sawal') or ''), 'masala-72 sawal honours Gangohi'
          pp = json.load(open('assets/content/tashreeh-pages/jild-15.json', encoding='utf-8'))['pages']
          assert len(pp) == 662, len(pp)
          print('v1.1.4 tashreeh proof passed.')
          PYEOF
          cd "$GITHUB_WORKSPACE"
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatawa-razviya-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release v1.1.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          name: Fatawa Razviya — Aasan Urdu v1.1.4 (Full v4 re-written tashreeh — all 30 jilds)
          body: |
            Fatawa Razviya — Aasan Urdu (v1.1.4, debug build).

            The full v4 re-write of the tashreeh — ALL 30 jilds, 7,923
            masail/sections, 19,698 pages, re-written in the easiest Urdu:
            - Every hard word explained definitionally in the flow
              ("X کو Y کہتے ہیں" / "X کا مطلب Y ہے") — ~103,000 glosses.
            - Ala Hazrat's harsh tone kept throughout the whole book, never
              softened; his exact harsh words used wherever he used them.
            - No honorifics for the opponents of Ahl-e-Sunnat — plain
              کہا / لکھا for Deobandi/Wahabi figures; honorifics stay for
              Allah, the Prophet ﷺ, the Quran, Sahaba and Sunni imams.
            - Per-page tashreeh — every page shows the tashreeh of the
              words on THAT page, flowing continuously. No "continues
              explanation" anywhere.
            - References kept as the original gives them (book, page,
              volume), in Arabic, in the orange reference box.

            - All v1.1.3 features kept: lesson list with front matter under
              each volume, original-style search options, reader exit/home
              button, blue Arabic, bilingual UI (English label + Urdu in
              brackets), search-shake fix, bottom nav + scroll + reader lag
              fixes, WebViewAssetLoader load fix
            - All 30 jilds complete: 7,923 masail/sections, 19,698 pages
            - Rasail, fehrist, search, bookmarks and notes
            - Fully offline — no account, no internet needed
          files: app/build/outputs/apk/debug/app-debug.apk
