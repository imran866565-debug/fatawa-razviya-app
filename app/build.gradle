plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fatawa.razviya.easyurdu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fatawa.razviya.easyurdu'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: serves the bundled reader over a real https
    // origin so fetch() works (file:// fetch is blocked in WebView).
    implementation 'androidx.webkit:webkit:1.12.0'
}
