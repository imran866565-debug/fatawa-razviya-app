}

android {
    namespace 'com.fatawa.razviya.easyurdu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fatawa.razviya.easyurdu'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
